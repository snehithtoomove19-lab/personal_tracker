name: Bug report
description: Report a reproducible problem with the app.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, passwords, private tracker records, or unredacted device logs.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Device/OS and Flutter app version, if known.
      placeholder: Android 15, app version 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence of steps.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and personal tracker data from this report.
          required: true
